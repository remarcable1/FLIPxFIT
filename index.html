<script>
/* FLIP x FIT automatic update check — v63 */
const FLIP_APP_VERSION='63';
(function(){
  if(location.protocol==='file:') return;
  const bust=Date.now();
  fetch('./version.json?cb='+bust,{cache:'reload'}).then(r=>r.ok?r.json():null).then(async info=>{
    const latest=String(info&&info.version||'');
    if(!latest || latest===FLIP_APP_VERSION) return;
    // Loop guard: reload at most once per version per browser session (stale CDN/cache would otherwise reload forever).
    try{if(sessionStorage.getItem('flipstix_upd')===latest)return;sessionStorage.setItem('flipstix_upd',latest)}catch(e){}

    // A previously installed service worker can otherwise keep serving an old index.html.
    // Remove old workers first, then reload the real index.html with a unique query string.
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(key=>caches.delete(key)));
      }
    }catch(e){}

    const indexUrl=new URL('./index.html',location.href);
    indexUrl.search='?v='+encodeURIComponent(latest)+'&cb='+Date.now();
    location.replace(indexUrl.toString());
  }).catch(()=>{});
})();
</script>

}
function showModal(id,reuseHistory=false){
  const el=document.getElementById(id);

  if(!modalHistoryActive && !reuseHistory){

 const toward=_contrastRatioRgb(_hexRgb(black),s)>=_contrastRatioRgb(_hexRgb(white),s)?black:white;
 let best=accent;
 for(let i=1;i<=40;i++){
   const candidate=_mixHex(accent,toward,i/40);
   if(_contrastRatioRgb(_hexRgb(candidate),s)>=minRatio){best=candidate;break;}
   best=candidate;

}

function hexToRgb(hex){const m=String(hex).trim().match(/^#?([0-9a-f]{6})$/i);if(!m)return null;return{r:parseInt(m[1].slice(0,2),16),g:parseInt(m[1].slice(2,4),16),b:parseInt(m[1].slice(4,6),16)}

function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
function hsvToRgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return{r:(r+m)*255,g:(g+m)*255,b:(b+m)*255}}
let wheelHSV=[0,1,1];
function setWheelFromHex(hex){const rgb=hexToRgb(hex);if(!rgb)return;wheelHSV=rgbToHsv(rgb.r,rgb.g,rgb.b);updateWheelUI()}

function updateWheelUI(){
 const wheel=document.getElementById('colorWheel'),cursor=document.getElementById('colorWheelCursor'),preview=document.getElementById('colorPreview'),input=document.getElementById('colorHexInput'); if(!wheel)return;

/* v40 dynamic contrast engine */
function _parseRgbColor(value){
  const m=String(value||'').match(/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s/]+([\d.]+))?\s*\)/i);
  if(!m)return null;
  const a=m[4]===undefined?1:parseFloat(m[4]);
  return {r:Math.max(0,Math.min(255,parseFloat(m[1]))),g:Math.max(0,Math.min(255,parseFloat(m[2]))),b:Math.max(0,Math.min(255,parseFloat(m[3]))),a:Number.isFinite(a)?a:1};
}
function _relativeLuminance(rgb){
  const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  return .2126*f(rgb.r)+.7152*f(rgb.g)+.0722*f(rgb.b);
}
function _contrastRatioRgb(fg,bg){
  const a=_relativeLuminance(fg),b=_relativeLuminance(bg),hi=Math.max(a,b),lo=Math.min(a,b);
  return (hi+.05)/(lo+.05);
}
function _hexRgb(hex){
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-f]{6}$/i.test(h))return null;
  return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16),a:1};
}
function _nearestOpaqueBackground(el){
  let n=el;
  while(n&&n!==document.documentElement){
    const bg=_parseRgbColor(getComputedStyle(n).backgroundColor);
    if(bg&&bg.a>.05)return bg;
    n=n.parentElement;
  }
  const bodyBg=_parseRgbColor(getComputedStyle(document.body).backgroundColor);
  return bodyBg||_hexRgb(document.documentElement.classList.contains('dark-mode')?'#0F172A':'#F8FAFC');
}
function applyDynamicContrast(){
  const selectors=[
    'button:not(.color-popup-choice):not(.color-choice)',
    '.card','.item','.guide-step','.pattern-box','.rod-card','.badge',
    '.story-chapter','.story-summary','.story-level','.chapter-card',
    '.story-hurdle','.hurdle-note','.modal-card','.modal-actions button',
    '.settings-home-btn','.game-nav button','.header-stars','.toast',
    '.muted','.pill','.section-note','.tag','.solve-btn',
    '.rod-color-button'
  ];
  const light=_hexRgb('#F5F7FA'),dark=_hexRgb('#0F172A'),lightMuted=_hexRgb('#CBD5E1'),darkMuted=_hexRgb('#475569');
  if(!light||!dark)return;
  document.querySelectorAll(selectors.join(',')).forEach(el=>{
    if(!el||el.closest('.color-wheel'))return;
    // Primary accent controls use their explicit accent surface as the contrast source.
    // This avoids a transient transparent/previous-state background after actions such as task reset.
    let bg=_nearestOpaqueBackground(el);
    if(el.matches('.story-cta,.solve-btn:not(.solved),.game-nav .nav-home,.lang-grid button.active,.color-popup-actions button.primary')){
      const accent=_hexRgb(getComputedStyle(document.documentElement).getPropertyValue('--brand-ui').trim());
      if(accent) bg=accent;
    }
    if(el.matches('.solve-btn.solved')){
      bg=_hexRgb('#15803D');
    }
    if(!bg)return;
    const lightScore=_contrastRatioRgb(light,bg),darkScore=_contrastRatioRgb(dark,bg);
    const useLight=lightScore>=darkScore;
    el.style.setProperty('--auto-text',useLight?'#F5F7FA':'#0F172A');
    el.style.setProperty('--auto-muted',useLight?'#CBD5E1':'#475569');
    el.setAttribute('data-auto-contrast','');
    el.style.setProperty('color',useLight?'#F5F7FA':'#0F172A','important');
  });
}
